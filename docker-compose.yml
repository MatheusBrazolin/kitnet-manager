services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitmanager
      POSTGRES_PASSWORD: kitmanager
      POSTGRES_DB: kitmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://kitmanager:kitmanager@postgres:5432/kitmanager
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-forte}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  postgres_data:
